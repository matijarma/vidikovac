<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" role="img" aria-labelledby="f-uparivanje-t f-uparivanje-d" font-family="var(--font-sans)" style="font-family:var(--font-sans);color:var(--tone-text-primary)">
<title id="f-uparivanje-t">Uparivanje zaslona i telefona: od koda do sobe</title>
<desc id="f-uparivanje-d">Slijed poruka između zaslona, telefona, Workera, IndexDO-a, BeaconDO-a i RoomDO-a: BeaconDO kuje paket kodova, telefon šalje kod u tijelu POST zahtjeva, Worker ga razrješava kroz IndexDO, BeaconDO provjerava prozor, jednokratnost i opoziv pa otvara RoomDO na deset minuta, oba uređaja ulaze u sobu, a Podijeli grad kuje kod za drugu osobu na pet minuta.</desc>
