<title id="f-sesija-t">Sesija od deset minuta: otključano, upozorenje na minutu, na dvadeset sekundi, zatvoreno</title>
<desc id="f-sesija-d">Vremenska crta sesije: u 0:00 otključano s punim prstenom, u 9:00 upozorenje „Još minuta. Ono što gledaš ostaje na zaslonu i nakon isteka.“, u 9:40 „Još dvadeset sekundi.“, u 10:00 zatvoreno: telefon zamrznut s oznakom zamrznuto i podacima od 19:10, zaslon se vraća pozivu, soba briše sve. Osvježavanje nastavlja istu sesiju; novo skeniranje daje novih deset minuta u istoj kartici.</desc>
