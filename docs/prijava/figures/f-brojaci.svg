<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 468" role="img" aria-labelledby="f-brojaci-t f-brojaci-d" font-family="var(--font-sans)" style="font-family:var(--font-sans);color:var(--tone-text-primary)">
<title id="f-brojaci-t">Brojači: što Grad dobiva, i što nitko ne može dobiti</title>
<desc id="f-brojaci-d">Redak brojača ima oblik (dan, sat, događaj, dim1, dim2) → broj u zatvorenim rječnicima: deset događaja, šest vrsta mjesta, sedamnaest gradskih četvrti. Tri primjera retka. Izvoz Gradu zaokružuje brojeve na 5, ćelije ispod 10 spaja u „ostalo“, a over_cap, source_fetch i evaluation ne izvozi. Nema IP adrese, korisničkog agenta, identifikatora uređaja, kolačića ni koordinata.</desc>
