<text x="24" y="96"><tspan font-size="14" font-weight="700" style="fill:var(--tone-text-primary)">(dan, sat, događaj, dim1, dim2) → broj</tspan><tspan font-size="12" font-weight="500" style="fill:var(--tone-text-muted)">   Europe/Zagreb, zatvoreni rječnici</tspan></text>
