<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="f-arhitektura-t f-arhitektura-d" font-family="var(--font-sans)" style="font-family:var(--font-sans);color:var(--tone-text-primary)">
<title id="f-arhitektura-t">Arhitektura: jedan Worker, četiri Durable Objecta, bez baze korisnika</title>
<desc id="f-arhitektura-d">Tri uređaja (javni zaslon, telefon, radna površina) govore s jednim Cloudflare Workerom; Worker koristi četiri Durable Objecta (BeaconDO po zaslonu, RoomDO po sesiji, IndexDO i MetricsDO kao singletone), KV i R2, a podatke dohvaća iz otvorenih izvora: ZET, data.zagreb.hr, DHMZ, EMSC, HRT, Službeni glasnik i šest izvora događanja.</desc>
