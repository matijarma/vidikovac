<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="f-vizija-t f-vizija-d" font-family="var(--font-sans)" style="font-family:var(--font-sans);color:var(--tone-text-primary)">
<title id="f-vizija-t">Vizija: ekonomija pažnje nasuprot ekonomiji prisutnosti</title>
<desc id="f-vizija-d">Dva panela. Lijevo, prigušeno, ekonomija pažnje: telefon s beskrajnim listanjem koje blijedi prema dnu, zvono s oznakom jer obavijesti te vraćaju, i strelica koja se s dna telefona vraća na njegov vrh; mjerilo je zadržavanje. Desno, u boji, ekonomija prisutnosti Kaj ima?: krug od četiri koraka, mjesto (kafić, knjižnica, ured četvrti), prisutnost (skeniraj ili dodirni), deset minuta (cijeli grad na tvom uređaju) i natrag u grad (pogled se sam zatvori), pa sljedeće mjesto i sljedeći čovjek. Uz krug: prostor dobiva goste, izdavač dobiva doseg, Grad dobiva uvid bez praćenja, osoba pokraj tebe pet minuta; mjerilo su sesije i dostupnost izvora, nikad zadržavanje. Ispod: Manje zaslona, više grada.</desc>
