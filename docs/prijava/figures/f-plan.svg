<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 532" role="img" aria-labelledby="f-plan-t f-plan-d" font-family="var(--font-sans)">
<title id="f-plan-t">Plan provedbe: M0 prije potpisa, M1 do M7 kroz deset mjeseci, uloge po mjesecu</title>
<desc id="f-plan-d">Gantt-prikaz devet ključnih točaka. M0 Prototip uživo prije potpisa, javno od 14. 9. 2026. M1 Protokol, izjave, prva revizija pristupačnosti u mjesecima 1 do 2. M1b Lagani način za stare uređaje u mjesecu 2. M2 Svi zeleni izvori, pisma vlasnicima podataka u mjesecima 2 do 3. M3 Šest zaslona instalirano, administracija u mjesecima 3 do 4. M4 Prvi skup podataka Gradu, ZGBit, /open katalog u mjesecu 5. M5 Žuti izvori, HRT/HAK ako je dopušteno, izvještaj o pouzdanosti u mjesecima 6 do 8. M6 Druga revizija pristupačnosti, javni izvještaj u mjesecu 9. M7 Završni izvještaj, inačica 1.0, paket za predaju u mjesecu 10. Ispod je traka sedam uloga s točkom u svakom mjesecu sudjelovanja; voditelj i glavni razvoj u svim mjesecima. Krajnji rok Programa je 31. 12. 2027.</desc>
